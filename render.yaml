# Free compute. Database and private photos persist in Supabase, not on Render.
services:
  - type: web
    name: familyhubs
    runtime: node
    repo: https://github.com/rvreddy24/Family
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATA_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: PRIVATE_STORAGE_BUCKET
        value: familyhubs-proofs
      - key: CORS_ORIGIN
        value: https://familyhubs.in,https://www.familyhubs.in
      - key: WHATSAPP_AUTOMATIC_ENABLED
        value: 'false'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
